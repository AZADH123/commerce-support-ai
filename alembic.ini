[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is normally overridden by DATABASE_URL / SUPPORT_AGENT_DB_URL;
# the env.py reads the environment first and only falls back to this value.
sqlalchemy.url = postgresql+psycopg://support:support@localhost:5432/support

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
